<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetVibes - Register</title>
    <link rel="stylesheet" href="thisregistration.css">
    <link href="https://fonts.googleapis.com/css2?family=Chewy&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <section class="registerSection">

            <!-- LEFT: Pictures Area -->
            <div class="picturesArea">
                <img class="thisPaw1" src="pawImage.png" alt="paw print">
                <img class="thisPaw2" src="pawImage.png" alt="paw print">
                <img class="thisPaw3" src="pawImage.png" alt="paw print">
                <img class="thisPaw4" src="pawImage.png" alt="paw print">
                <img class="thisPaw5" src="pawImage.png" alt="paw print">
                <img class="thisPaw6" src="pawImage.png" alt="paw print">

                <img class="dogandcatPhoto" src="dogandcat2.jpg" alt="dog and cat">

                <div class="imageContent">
                    <h2 class="firstPart">Join the</h2>
                    <h2 class="secondPart">PetVibes family!</h2>

                    <h4 class="firstSen">Create your free account</h4>
                    <h4 class="secondSen">and give your furry friend</h4>
                    <h4 class="thirdSen">the care they truly</h4>
                    <h4 class="fourthSen">deserve. 🐾</h4>
                </div>
            </div>

            <!-- RIGHT: Form Area -->
            <div class="textfieldArea">
                <div class="headerLogo">
                    <img class="pawImage" src="logoPaw2.png" alt="PetVibes Logo">
                    <h3>PetVibes</h3>
                </div>

                <h1 class="helloPart">Hey There!</h1>
                <h1 class="welcomeBackPart">Create Account</h1>

                <div class="inputContainer">

                    <!-- Full Name -->
                    <input id="fullNameInput" type="text" placeholder="Full Name">
                    <p id="fullNameWarning" class="warning"></p>

                    <!-- Email -->
                    <input id="emailInput" type="email" placeholder="Email Address">
                    <p id="emailWarning" class="warning"></p>

                    <!-- Username -->
                    <input id="usernameInput" type="text" placeholder="Username">
                    <p id="usernameWarning" class="warning"></p>

                    <!-- Password -->
                    <div class="input-wrapper">
                        <input id="passwordInput" type="password" placeholder="Password">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="#F2795E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                    </div>
                    <p id="passwordWarning" class="warning"></p>

                    <!-- Confirm Password -->
                    <div class="input-wrapper">
                        <input id="confirmPasswordInput" type="password" placeholder="Confirm Password">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="#F2795E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                    </div>
                    <p id="confirmPasswordWarning" class="warning"></p>

                </div>

                <button type="button" id="registerButton">Register</button>

                <p class="loginLink"><a href="finalLogin.html">Already have an account? Login</a></p>

                <p class="continueText">or sign up with</p>

                <div class="containerforIcon">
                    <img class="googlePic" src="googleIcon.png" alt="Google Icon">
                    <img class="facebookPic" src="facebookIcon.png" alt="Facebook Icon">
                </div>
            </div>

        </section>
    </div>

    <script src="registerCheck.js"></script>
</body>

</html>
